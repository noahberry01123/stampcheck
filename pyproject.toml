[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "stampcheck"
version = "0.1.0"
description = "Check whether your human approval step still filters anything, or has become a rubber stamp."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]
yaml = ["PyYAML>=6"]
dev = ["pytest>=7"]

[project.scripts]
stampcheck = "stampcheck.cli:main"

[tool.setuptools]
packages = ["stampcheck"]

[tool.pytest.ini_options]
testpaths = ["tests"]
