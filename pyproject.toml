[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "stampcheck"
version = "0.1.3"
description = "Check whether your human approval step still filters anything, or has become a rubber stamp."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Noah Berry" }]
requires-python = ">=3.10"
dependencies = []
keywords = ["human-in-the-loop", "human review", "approval", "rubber stamp", "automation bias", "audit"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Quality Assurance",
]

[project.urls]
Homepage = "https://stampcheck.io"
Repository = "https://github.com/noahberry01123/stampcheck"
Issues = "https://github.com/noahberry01123/stampcheck/issues"
Discussions = "https://github.com/noahberry01123/stampcheck/discussions"

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]
yaml = ["PyYAML>=6"]
dev = ["pytest>=7"]

[project.scripts]
stampcheck = "stampcheck.cli:main"

[tool.setuptools]
packages = ["stampcheck"]

[tool.pytest.ini_options]
testpaths = ["tests"]
